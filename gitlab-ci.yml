# ============================================================
# Seguridad en Desarrollo Software — Actividad Práctica
# Pipeline DevSecOps completo para GitLab CI/CD
# Aplicación objetivo: DVWA (Damn Vulnerable Web Application)
# ============================================================

stages:
  - test
  - scan
  - dast

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  DAST_WEBSITE: "https://eipdss.000webhostapp.com/DVWA/"
  DAST_AUTH_URL: "https://eipdss.000webhostapp.com/DVWA/login.php"
  DAST_USERNAME_FIELD: "username"
  DAST_PASSWORD_FIELD: "password"
  DAST_SUBMIT_FIELD: "Login"
  DAST_FULL_SCAN_ENABLED: "false"
  DAST_AUTH_VERIFICATION_URL: "https://eipdss.000webhostapp.com/DVWA/index.php"

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

# ============================================================
# STAGE: test
# ============================================================

secret_detection:
  stage: test
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
    expire_in: 1 week
  allow_failure: false

sast:
  stage: test
  variables:
    SAST_EXCLUDED_PATHS: "spec, test, tests, tmp"
    SAST_DISABLE_BABEL: "true"
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week

snyk-sast:
  stage: test
  image: snyk/snyk:php
  script:
    - snyk auth $SNYK_TOKEN
    - snyk test --severity-threshold=high --json-file-output=snyk-sast-report.json || true
    - snyk code test --severity-threshold=high --json-file-output=snyk-code-report.json || true
    - CRITICAL_COUNT=$(python3 -c "import json; d=json.load(open('snyk-sast-report.json')); print(sum(1 for v in d.get('vulnerabilities',[]) if v.get('severity')=='critical'))" 2>/dev/null || echo "0")
    - if [ "$CRITICAL_COUNT" -gt "0" ]; then echo "ERROR $CRITICAL_COUNT critical vulnerabilities"; exit 1; fi
  artifacts:
    when: always
    paths:
      - snyk-sast-report.json
      - snyk-code-report.json
    expire_in: 1 week
  allow_failure: true
  only:
    - master
    - merge_requests

# ============================================================
# STAGE: scan
# ============================================================

sonarcloud-analysis:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.projectKey=janclararobles_dss -Dsonar.organization=janclararobles-group -Dsonar.sources=. -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
  artifacts:
    when: always
    paths:
      - .sonar/
    expire_in: 1 week
  allow_failure: false
  only:
    - master
    - merge_requests

dependency-check:
  stage: scan
  image:
    name: owasp/dependency-check:latest
    entrypoint: [""]
  script:
    - mkdir -p reports
    - /usr/share/dependency-check/bin/dependency-check.sh --project "${CI_PROJECT_NAME}" --scan . --format JSON --format HTML --out ./reports/ --enableExperimental || true
    - CRITICAL=$(python3 -c "import json; data=json.load(open('reports/dependency-check-report.json')); deps=data.get('dependencies',[]); critical=[v for d in deps for v in d.get('vulnerabilities',[]) if float(v.get('cvssv3',{}).get('baseScore',0))>=9.0]; print(len(critical))" 2>/dev/null || echo "0")
    - echo "Vulnerabilidades criticas CVSS>=9.0 = $CRITICAL"
    - if [ "$CRITICAL" -gt "0" ]; then echo "BLOQUEANDO pipeline $CRITICAL vulnerabilidades criticas"; exit 1; fi
  artifacts:
    when: always
    paths:
      - reports/dependency-check-report.json
      - reports/dependency-check-report.html
    expire_in: 1 week
  cache:
    paths:
      - /usr/share/dependency-check/data/

dependency_scanning:
  stage: scan
  variables:
    DS_EXCLUDED_ANALYZERS: ""
    SECURE_LOG_LEVEL: "info"
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week

# ============================================================
# STAGE: dast
# ============================================================

dast:
  stage: dast
  variables:
    DAST_WEBSITE: "https://eipdss.000webhostapp.com/DVWA/"
    DAST_FULL_SCAN_ENABLED: "false"
    DAST_AUTH_URL: "https://eipdss.000webhostapp.com/DVWA/login.php"
    DAST_USERNAME: $DAST_USERNAME
    DAST_PASSWORD: $DAST_PASSWORD
    DAST_USERNAME_FIELD: "username"
    DAST_PASSWORD_FIELD: "password"
    DAST_SUBMIT_FIELD: "Login"
    DAST_AUTH_VERIFICATION_URL: "https://eipdss.000webhostapp.com/DVWA/index.php"
    DAST_ZAP_CLI_OPTIONS: "-config scanner.attackStrength=LOW"
  artifacts:
    when: always
    reports:
      dast: gl-dast-report.json
    paths:
      - gl-dast-report.json
    expire_in: 1 week
  allow_failure: false
